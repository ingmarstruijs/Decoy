AutoName: Decoy
Name: Decoy
Summary: FOSS privacy layer for physical-world services
Description: |-
  Decoy is a free, local-first Android privacy layer for physical-world services
  (campsite orders, parking, captive Wi-Fi, EV charging, Multi-day stays).
  It resolves QR/NFC/BLE/zone inputs into Compose UI, applies field policy
  (alias / omit / pay elsewhere), and pays out-of-band. No Play Services,
  Firebase, or advertising IDs.

